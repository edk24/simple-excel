name: Tester
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  PHPUnit:
    name: ${{ matrix.os }}-php${{ matrix.php-version }}
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest ]
        php-version:
          - 7.3
          - 7.4
          - 8.0
          - 8.1
          - 8.3
          - 8.4
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, dom, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          coverage: none
      - name: Install Dependencies
        run: composer update --no-interaction --prefer-dist
      - name: Run PHPUnit
        run: composer test
